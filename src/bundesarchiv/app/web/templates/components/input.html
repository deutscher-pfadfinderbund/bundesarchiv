{% comment %}
Text/search input atom. Params: name (required); type (default "text"); value; placeholder.
With label: renders a labeled field. Without label: pass aria_label (accessible name).
{% endcomment %}
{% if label %}
<label class="c-field">
  <span class="c-field-label">{{ label }}</span>
  <input class="c-input" type="{{ type|default:'text' }}" name="{{ name }}"
         value="{{ value|default:'' }}" placeholder="{{ placeholder|default:'' }}">
</label>
{% else %}
<input class="c-input" type="{{ type|default:'text' }}" name="{{ name }}"
       value="{{ value|default:'' }}" placeholder="{{ placeholder|default:'' }}"
       aria-label="{{ aria_label }}">
{% endif %}
