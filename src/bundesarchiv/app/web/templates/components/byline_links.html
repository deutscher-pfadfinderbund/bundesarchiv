{% comment %}A labelled byline of links joined by dots. Params: label; links — byline.BylineLink;
more — how many links are left out, printed as a last item "+n" (0 prints nothing).{% endcomment %}
<dl class="byline">
  <div class="byline-links">
    <dt>{{ label }}</dt>
    <dd>
      {% for link in links %}
        <a href="{{ link.href }}"
           {% if link.aria_label %}aria-label="{{ link.aria_label }}"{% endif %}
           {% if link.new_tab %}target="_blank" rel="noopener"{% endif %}>{{ link.label }}</a>
      {% endfor %}
      {% if more %}<span>+{{ more }}</span>{% endif %}
    </dd>
  </div>
</dl>
