{% comment %}
Lifecycle badge. Param: draft (bool). ENTWURF pops (the draft role — the one warm hue, spec
semantic note); Veröffentlicht is the quiet outlined positive signal, never omitted.
{% endcomment %}
{% if draft %}<span class="c-badge c-badge--entwurf">Entwurf</span>{% else %}<span class="c-badge c-badge--veroeffentlicht">Veröffentlicht</span>{% endif %}
