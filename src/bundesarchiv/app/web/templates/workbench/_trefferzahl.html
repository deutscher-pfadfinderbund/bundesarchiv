{% comment %}
The one renderer of the hit count (law C7). With oob, the HX-Request render swaps the text into the
rail's #trefferzahl by innerHTML, so the aria-live node survives and announces.
{% endcomment %}
<p id="trefferzahl" aria-live="polite"{% if oob %} hx-swap-oob="innerHTML"{% endif %}>{{ total }} Treffer</p>
