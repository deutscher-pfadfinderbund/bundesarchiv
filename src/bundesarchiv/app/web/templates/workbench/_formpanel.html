{% comment %}Param: panel — a panels.FormPanel.{% endcomment %}
<form class="toolpanel" id="{{ panel.id }}" popover method="post" action="{{ panel.action }}"
      hx-post="{{ panel.action }}" hx-target="this" hx-select="form > *" hx-swap="innerHTML" hx-sync="this:drop">
  {% for field in panel.fields %}{% include "workbench/_field.html" with field=field only %}{% endfor %}
  <div class="actions">
    <button class="primary" type="submit">{{ panel.button }}</button>
    {% include "components/toolpanel_cancel.html" with panel=panel.id only %}
  </div>
  {% csrf_token %}
</form>
