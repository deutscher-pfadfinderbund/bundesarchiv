{% comment %}The top-level Bestände with their counts, each opening the list scoped to it.{% endcomment %}
{% if area.tiles %}
<section data-absent="s" aria-labelledby="start-collections">
  <header class="section-head"><h2 id="start-collections">Bestände</h2></header>
  <ul class="tiles">
    {% for tile in area.tiles %}
    <li>
      {% include "start/_tile.html" with item=tile only %}
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
