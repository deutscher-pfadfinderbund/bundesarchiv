{% comment %}The decades with a bar each (a meter: its count out of the largest row's), then the undated ones.{% endcomment %}
{% if area.rows %}
<section data-absent="s" aria-labelledby="start-zeit">
  <header class="section-head"><h2 id="start-zeit">Zeitleiste</h2><span class="section-head-aside">nach Jahrzehnt</span></header>
  <ul class="tiles">
    {% for row in area.rows %}<li{% if row.apart %} class="register-apart"{% endif %}><a class="register-row" href="{{ row.tile.href }}" aria-label="{{ row.tile.label }}: {{ row.tile.count_label }} Artikel"><span class="register-label">{{ row.tile.label }}</span><meter class="register-bar" value="{{ row.tile.count }}" max="{{ row.top }}" aria-hidden="true"></meter><span class="register-figure"><data value="{{ row.tile.count }}">{{ row.tile.count_label }}</data></span></a></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
