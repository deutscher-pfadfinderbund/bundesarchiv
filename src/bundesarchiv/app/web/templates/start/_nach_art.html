{% comment %}The most-used Medienarten with their counts, each opening the list scoped to it.{% endcomment %}
{% if area.tiles %}
<section data-absent="s" aria-labelledby="start-art">
  <header class="section-head"><h2 id="start-art">Nach Art</h2></header>
  <ul class="tiles">
    {% for tile in area.tiles %}<li><a class="register-row" href="{{ tile.href }}" aria-label="{{ tile.label }}: {{ tile.count_label }} Artikel"><span class="register-label">{{ tile.label }}</span><span class="register-figure"><data value="{{ tile.count }}">{{ tile.count_label }}</data></span></a></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
