[project]
name = "bundesarchiv"
version = "0.1.0"
description = "DPB Bundesarchiv — multimedia archive"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.8.0",
    "django>=6.0",
    "gunicorn>=23.0",
    "httpx2>=2.13.0",
    "joserfc>=1.7.5",
    "pillow>=12.3.0",
    "procrastinate[django]>=3.9",
    "psycopg[binary]>=3.2",
    "pypdfium2>=5.13.0",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "whitenoise[brotli]>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "django-stubs>=6.1.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0,<2.5",
    "pre-commit>=3.8",
    "wsgidav>=4.3.4",
    "cheroot>=11.1.2",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-playwright>=0.5",
    "pyrefly>=1.3.2",
    "pytest-xdist>=3.8.0",
    "complexipy>=8.0.1,<9",
]

# Editor LSP only; mypy is the gate.
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# Second opinion to mypy, at zero errors: a false positive gets a per-file toggle, not an inline ignore.
[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
# Repo root first, so `tests.*` resolves as under mypy's explicit_package_bases.
search-path = [".", "src"]
errors = { deprecated = "error" }

[[tool.pyrefly.sub-config]]
# `SearchHit(**{**row, ...})`: pyrefly can't narrow the heterogeneous row dict.
matches = "src/bundesarchiv/index/query.py"
errors = { bad-argument-type = false }

[[tool.pyrefly.sub-config]]
# authlib ships no types; keycloak.py is the seam that types its answers.
matches = "**/*keycloak*.py"
errors = { untyped-import = false }

[[tool.pyrefly.sub-config]]
# procrastinate's `Concatenate[int, Args]` defer signature: pyrefly can't unify it.
matches = "src/bundesarchiv/app/tasks.py"
errors = { bad-argument-type = false }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "I", "UP", "B", "SIM", "RUF", "C4", "FURB", "PERF", "PIE", "PTH", "RET", "BLE", "DTZ", "PGH", "S",
    # Design signals: flag parameters, unused arguments, private access, size and branching.
    "FBT", "ARG", "SLF", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    # Hygiene: commented-out code, deferral markers, prints, builtin shadowing, logging, Django.
    "ERA", "FIX", "TD", "T20", "A", "G", "LOG", "PLE", "RSE", "FLY", "ISC", "DJ",
]

[tool.ruff.lint.per-file-ignores]
# Django owns the migrations' mutable class attributes.
"**/migrations/*.py" = ["RUF012"]
# The README codecs reject corrupt file content with ValueError, a pinned contract.
"src/bundesarchiv/persistence/readme.py" = ["TRY004"]
"src/bundesarchiv/persistence/collection_readme.py" = ["TRY004", "ARG001"]
# Tests assert, and their keys and passwords are fixtures. Fixtures are requested for their
# effect and parametrized flags are data.
"tests/**" = ["S101", "S105", "S106", "ARG", "FBT", "SLF"]
# Django fixes the command signature; the scripts talk to a terminal.
"src/bundesarchiv/app/management/commands/*.py" = ["ARG002"]
"scripts/**" = ["T20"]
# Offenders pinned when the design rules arrived (2026-10-13), plus ARG001 in collection_readme.py
# above. Fix and remove, never add.
"src/bundesarchiv/app/articles.py" = ["PLR0913"]
"src/bundesarchiv/app/models.py" = ["DJ008"]
"src/bundesarchiv/app/tasks.py" = ["ARG001"]
"src/bundesarchiv/app/web/browse_views.py" = ["FBT001", "PLR0913"]
"src/bundesarchiv/app/web/bulk.py" = ["FBT003", "PLR0911"]
"src/bundesarchiv/app/web/bulk_views.py" = ["PLR0913"]
"src/bundesarchiv/app/web/card.py" = ["PLR0913"]
"src/bundesarchiv/app/web/catalog.py" = ["PLR0913"]
"src/bundesarchiv/app/web/catalog_views.py" = ["PLR0913"]
"src/bundesarchiv/app/web/dev.py" = ["ARG001"]
"src/bundesarchiv/app/web/landing.py" = ["FBT001"]
"src/bundesarchiv/app/web/ledger.py" = ["FBT001", "PLR0913"]
"src/bundesarchiv/app/web/legacy_params.py" = ["SLF001"]
"src/bundesarchiv/app/web/media.py" = ["ARG001"]
"src/bundesarchiv/app/web/media_views.py" = ["ARG001"]
"src/bundesarchiv/app/web/panels.py" = ["PLR0913"]
"src/bundesarchiv/domain/identity.py" = ["PLR0913"]
"src/bundesarchiv/index/models.py" = ["DJ001", "DJ008"]
"src/bundesarchiv/index/query.py" = ["C901", "PLR0913"]
"src/bundesarchiv/persistence/_writer.py" = ["PLR0913"]
"src/bundesarchiv/persistence/adapters/localfs.py" = ["ARG001", "ARG002"]
"src/bundesarchiv/persistence/adapters/memory.py" = ["ARG002"]
"tests/app/test_rebuild_thumbnails.py" = ["A002"]
"tests/app/web/_fixtures.py" = ["C901"]
"tests/app/web/test_bulk_views.py" = ["PLR0913"]
"tests/app/web/test_design_lint.py" = ["C901", "PLR0912", "PLR0915"]
"tests/app/web/test_detail.py" = ["A002"]
"tests/app/web/test_leak_matrix.py" = ["PLR0913"]
"tests/e2e/_gallery.py" = ["PLR0913"]
"tests/e2e/test_gallery.py" = ["T201"]
"tests/e2e/test_journeys.py" = ["C901", "ERA001"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "manage.py"]
plugins = ["mypy_django_plugin.main"]
# Same-named test files (two conftest.py) stay distinct. Keep tests off mypy_path, or they get a
# second module name ("source file found twice").
explicit_package_bases = true
mypy_path = ["src"]

[tool.django-stubs]
django_settings_module = "bundesarchiv.index.settings"

# No types shipped: authlib (typed at the keycloak.py seam), pypdfium2 (at pdf.py) and the
# test WebDAV server.
[[tool.mypy.overrides]]
module = ["authlib.*", "pypdfium2.*", "wsgidav.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Needed before conftests load. It creates no database: only `django_db` tests touch Postgres.
DJANGO_SETTINGS_MODULE = "bundesarchiv.index.settings"
# Browser suites run only through `mise run test:e2e` / `test:gallery`.
markers = [
    "e2e: browser-driven end-to-end journey (excluded from the default run; -m e2e to run)",
    "gallery: renders the canonical-state screenshot gallery (excluded from the default run; -m gallery to run)",
    "requires_pg: needs the real Postgres on :5434 (auto-derived from DB fixtures; add explicitly only for out-of-band DB use)",
]
addopts = "--strict-markers -m 'not e2e and not gallery'"
