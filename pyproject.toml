[project]
name = "bundesarchiv"
version = "0.1.0"
description = "DPB Bundesarchiv — multimedia archive"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bundesarchiv"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "wsgidav>=4.3.4",
    "cheroot>=11.1.2",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# Keep ruff's defaults (E4/E7/E9, F); EXTEND with import-sort + modernization/idiom rules.
extend-select = ["I", "UP", "B", "SIM", "RUF", "C4", "FURB", "PERF", "PIE", "PTH", "RET"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Test-only WebDAV server libs ship no type stubs; they are exercised through the
# typed WebDavObjectStore + httpx, not depended on for types.
[[tool.mypy.overrides]]
module = ["wsgidav.*", "cheroot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
