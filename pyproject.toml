[project]
name = "bundesarchiv"
version = "0.1.0"
description = "DPB Bundesarchiv — multimedia archive"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bundesarchiv"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# Keep ruff's defaults (E4/E7/E9, F); EXTEND with import-sort + modernization/idiom rules.
extend-select = ["I", "UP", "B", "SIM", "RUF", "C4", "FURB", "PERF", "PIE", "PTH", "RET"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
