[project]
name = "bundesarchiv"
version = "0.1.0"
description = "DPB Bundesarchiv — multimedia archive"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "procrastinate[django]>=3.9",
    "psycopg[binary]>=3.2",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "django-stubs[compatible-mypy]>=5.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "wsgidav>=4.3.4",
    "cheroot>=11.1.2",
    "types-pyyaml>=6.0.12.20260518",
    # E2E journey suite + state gallery (Part #26). Dev-only, browser-driven; the ``e2e`` marker
    # keeps these out of the fast gate (they need a live server + the cached chromium-1228 browser).
    "pytest-playwright>=0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# Keep ruff's defaults (E4/E7/E9, F); EXTEND with import-sort + modernization/idiom rules.
extend-select = ["I", "UP", "B", "SIM", "RUF", "C4", "FURB", "PERF", "PIE", "PTH", "RET"]

[tool.ruff.lint.per-file-ignores]
# Django migration classes own `dependencies`/`operations` as bare class attributes (the
# framework mutates them); RUF012 (ClassVar) does not apply and 0002 is auto-generated.
"**/migrations/*.py" = ["RUF012"]

[tool.mypy]
strict = true
files = ["src", "tests", "manage.py"]
plugins = ["mypy_django_plugin.main"]
# Multiple conftest.py / test modules share basenames across tests/ subdirs; explicit package
# bases derive each module's name from its path relative to the repo root (the implicit base), so
# same-named files (e.g. two conftest.py) stay distinct and by-name imports like
# ``tests.index.fixtures`` resolve to ONE canonical module. mypy_path is src-only: adding tests
# here would give tests/ files a second name (``index.fixtures``) and collide with the repo-root
# one ("source file found twice").
explicit_package_bases = true
mypy_path = ["src"]

# django-stubs needs to know which settings to load to type the ORM. The index is the
# only place Django lives; this is type-checking config, not a runtime default.
[tool.django-stubs]
django_settings_module = "bundesarchiv.index.settings"

# Test-only WebDAV server libs ship no type stubs; they are exercised through the
# typed WebDavObjectStore + httpx, not depended on for types.
[[tool.mypy.overrides]]
module = ["wsgidav.*", "cheroot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-django needs DJANGO_SETTINGS_MODULE at plugin-configure time (before conftests are
# imported) to run django.setup(). Setting it here does NOT force a database on the pure
# suites: django.setup() is cheap and DB-free; pytest-django only creates the test database
# when a test actually uses the `db`/`django_db` fixture. tests/domain and tests/persistence
# use neither, so they still run with no Postgres. Only tests/index touches the DB, gated by
# tests/index/conftest.py (which fails, not skips, when Postgres is unreachable).
DJANGO_SETTINGS_MODULE = "bundesarchiv.index.settings"
# The E2E journey suite + state gallery (tests/e2e/, Part #26) drive a real browser against a live
# server — slow and heavyweight, so both are EXCLUDED from the default run (the fast gate +
# pre-commit) by their markers. Run them explicitly: `uv run pytest -m e2e` (the journeys),
# `uv run pytest -m gallery -s` (render the state gallery). All other suites are unaffected.
markers = [
    "e2e: browser-driven end-to-end journey (excluded from the default run; -m e2e to run)",
    "gallery: renders the canonical-state screenshot gallery (excluded from the default run; -m gallery to run)",
]
addopts = "-m 'not e2e and not gallery'"
