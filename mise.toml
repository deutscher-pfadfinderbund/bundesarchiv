[settings]
experimental = true # daemons, input groups
task.source_freshness_hash_contents = true

[tools]
biome = "2.5.15"

[env]
# A worktree under .claude/worktrees also loads the main checkout's mise.toml, before DATABASE_URL
# is set; the fallback is the main checkout's port, and the worktree's own mise.toml then wins.
BUNDESARCHIV_PG_DSN = "{{ env.DATABASE_URL | default(value='postgresql://postgres@127.0.0.1:5434/bundesarchiv') }}"
PYTHONDONTWRITEBYTECODE = false # some agent shells set it
PYTHONPYCACHEPREFIX = "{{ config_root }}/.var/pycache"

[daemons.postgres]
preset = "postgres"
version = "18.6"
port = { auto = true, base = 5434 }
# In the checkout, so removing a worktree removes its data and the server stops on its own.
data_dir = ".var/postgres"
options.database = "bundesarchiv"
# initdb takes the locale from the caller; SQL_ASCII cannot hold the ICU collation (ADR 0011).
env = { LANG = "en_US.UTF-8" }

[task_config.input_groups]
python = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  ".claude/skills/**/*.py",
  "manage.py",
  "deploy/**/*.py",
  "pyproject.toml",
  "uv.lock",
]
web = ["src/bundesarchiv/app/web/static/**", ".claude/settings.json", "biome.jsonc"]
tests = [
  "@group:python",
  "src/**",
  "tests/**",
  "design-system/**",
  "docs/design/design-system.md",
  "deploy/nginx/**",
  "!**/__pycache__/**",
]

[tasks]
image = "container system start && container build -t bundesarchiv ."

[tasks."lint:ruff"]
sources = ["@group:python"]
run = "uv run ruff check"

[tasks."lint:format"]
sources = ["@group:python"]
run = "uv run ruff format --check ."

[tasks."lint:imports"]
sources = ["@group:python"]
run = "uv run lint-imports"

[tasks."lint:pyrefly"]
sources = ["@group:python"]
run = "uv run pyrefly check src tests scripts --output-format=min-text"

[tasks."lint:mypy"]
sources = ["@group:python"]
run = "uv run mypy"

[tasks."lint:biome"]
sources = ["@group:web"]
run = "biome check --error-on-warnings"

[tasks."check:tests"]
hide = true
sources = ["@group:tests"]
run = [{ task = "test:nodb" }]

[tasks."gate:tests"]
hide = true
daemons = "postgres"
sources = ["@group:tests"]
run = [{ task = "test" }]

[tasks.check]
description = "Commit check: static checks and the tests that need no Postgres"
depends = ["lint:*", "check:tests"]

[tasks.gate]
description = "Push check: static checks and all tests outside the browser suites"
depends = ["lint:*", "gate:tests"]

[tasks.test]
description = "All tests outside the browser suites"
raw_args = true
daemons = "postgres"
run = "uv run pytest -n auto"

[tasks."test:nodb"]
description = "The tests that need no Postgres"
raw_args = true
run = 'uv run pytest -m "not requires_pg" -n auto'

[tasks."test:db"]
description = "The Postgres-backed tests"
raw_args = true
daemons = "postgres"
# A command-line -m replaces the addopts deselection of e2e and gallery.
run = 'uv run pytest -m "requires_pg and not e2e and not gallery" -n auto'

[tasks."test:affected"]
description = "The suites a diff needs: [BASE] [--dry-run]"
raw_args = true
run = "uv run python scripts/affected.py"

[tasks."e2e:browsers"]
description = "Install the chromium build the locked Playwright wants"
run = "uv run playwright install chromium"

[tasks."test:e2e"]
description = "Browser journeys"
raw_args = true
daemons = "postgres"
depends = ["e2e:browsers"]
run = "uv run pytest -m e2e -p playwright -n auto"

[tasks."test:gallery"]
description = "State gallery screenshots"
raw_args = true
daemons = "postgres"
depends = ["e2e:browsers"]
run = "uv run pytest -m gallery -p playwright -s -n auto"

[tasks."test:gallery-diff"]
description = "Pixel-diff the gallery against a git ref (default main): [REF]"
raw_args = true
daemons = "postgres"
depends = ["e2e:browsers"]
run = "uv run python scripts/gallery_diff.py"

[tasks.mutate]
description = "Mutation proof: FILE OLD NEW PYTEST_ARGS"
raw_args = true
run = "uv run python scripts/mutate.py"

[tasks.manage]
description = "manage.py with dev settings on this checkout's Postgres: mise run manage migrate"
raw_args = true
daemons = "postgres"
env = { DJANGO_SETTINGS_MODULE = "bundesarchiv.index.settings_dev" }
run = "uv run manage.py"

[tasks.dev]
description = "Dev server on :8000"
usage = 'arg "[addrport]" default="8000"'
daemons = "postgres"
run = [{ task = "manage", args = ["runserver", "{{ usage.addrport }}"] }]

[tasks."dev:legacy"]
description = "Dev server over the imported legacy archive"
usage = 'arg "[addrport]" default="8000"'
daemons = "postgres"
env = { BUNDESARCHIV_CANONICAL_ROOT = "var/legacy/canonical" }
run = [
  { task = "manage", args = ["rebuild_index"] },
  { task = "manage", args = ["rebuild_thumbnails"] },
  { task = "manage", args = ["runserver", "{{ usage.addrport }}"] },
]

[tasks."legacy:import"]
description = "One-time import of the legacy CSV export (pass --dry-run first)"
daemons = "postgres"
raw_args = true
# Its own canonical root: the import refuses a root that already holds Articles.
run = """
BUNDESARCHIV_CANONICAL_ROOT=${BUNDESARCHIV_CANONICAL_ROOT:-var/legacy/canonical} \
uv run manage.py import_legacy --csv-dir var/legacy \
  --media-root ${BUNDESARCHIV_LEGACY_MEDIA:-var/legacy/media}
"""

[tasks."quality:comments-only"]
description = "Exit 1 unless BASE..HEAD changes only comments and docstrings: BASE [HEAD]"
raw_args = true
run = "uv run python -m scripts.quality.comments_only"

[tasks."quality:comments"]
description = "Comments and docstrings ranked by smell flags"
raw_args = true
run = "uv run python -m scripts.quality.comments"

[tasks."quality:churn"]
description = "Function churn, hotspots, change coupling"
raw_args = true
run = "uv run python -m scripts.quality.churn"

[tasks."quality:indicators"]
description = "Pass-throughs, data clumps, repeated conditions, module depth"
raw_args = true
run = "uv run python -m scripts.quality.indicators"

[tasks."quality:trend"]
description = "Per week over main: fix escapes, debt counters, diff mix"
raw_args = true
run = "uv run python -m scripts.quality.trend"
