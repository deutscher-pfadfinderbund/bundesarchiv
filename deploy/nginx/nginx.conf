# The media sidecar (ADR 0017). Two jobs and no third: proxy everything to the app, and serve
# canonical blobs the app has already authorized. Static assets are WhiteNoise's (ADR 0016), TLS
# and the http redirect are Traefik's.

server {
    listen 80;
    server_name _;

    # Bounds the whole REQUEST, while BUNDESARCHIV_MAX_UPLOAD_BYTES (4 GiB) bounds each FILE and the
    # media manager posts a batch in one request. Kept at twice the per-file ceiling so the app
    # answers an oversize file in German; this 413 is the backstop against an absurd batch.
    client_max_body_size 8g;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik's value, never $scheme: TLS ends at Traefik, so $scheme is http here and Django
        # would refuse every POST on the CSRF origin check (SECURE_PROXY_SSL_HEADER in settings.py).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # nginx buffers the whole request body before forwarding, so a gigabyte-scale scan lands on
        # disk here first; the app then has this long to store it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # X-Accel-Redirect target: unreachable from outside, entered only when the app has run the
    # viewer through can_view. nginx serves the bytes and answers Range itself.
    # NO Cache-Control header and NO expires here — the app's `Cache-Control: private` must pass
    # through untouched (ADR 0017); either would replace it and make archive media cacheable by any
    # shared proxy. The redirect drops the app's CSP and nosniff, so this location adds both: an
    # uploaded SVG or HTML file runs no script.
    location /_media/ {
        internal;
        alias /canonical/;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
