# The media sidecar (ADR 0017). Two jobs and no third: proxy everything to the app, and serve
# canonical blobs the app has already authorized. Static assets are WhiteNoise's (ADR 0016), TLS
# and the http redirect are Traefik's.

server {
    listen 80;
    server_name _;

    # Just above Django's DATA_UPLOAD_MAX_MEMORY_SIZE (2.5 MiB), which caps every body without a
    # file, so the app answers first. Only the upload route below takes more.
    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Traefik's value, never $scheme: TLS ends at Traefik, so $scheme is http here and Django
    # would refuse every POST on the CSRF origin check (SECURE_PROXY_SSL_HEADER in settings.py).
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # nginx buffers the whole request body before forwarding, so a gigabyte-scale scan lands on
    # disk here first; the app then has this long to store it.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://app:8000;
    }

    # The one route that takes files. auth_request runs the upload view's own gate before nginx
    # reads the body, so only an Archivist can make nginx buffer a scan to disk.
    location ~ "^/artikel/(?<upload_ulid>[0-9A-HJKMNP-TV-Z]{26})/medien/hochladen$" {
        # Bounds the whole REQUEST, while BUNDESARCHIV_MAX_UPLOAD_BYTES (4 GiB) bounds each FILE and
        # the media manager posts a batch in one request. Kept at twice the per-file ceiling so the
        # app answers an oversize file in German; this 413 is the backstop against an absurd batch.
        client_max_body_size 8g;
        auth_request /_upload_gate;
        error_page 403 =404 @denied;
        proxy_pass http://app:8000;
    }

    location = /_upload_gate {
        internal;
        # The subrequest sends no body but is checked against the upload's Content-Length.
        client_max_body_size 0;
        rewrite ^ /upload-gate/$upload_ulid break;
        proxy_pass http://app:8000;
        proxy_method GET;
        proxy_pass_request_body off;
        # The gate sees who is asking and nothing else: an htmx header would turn the anonymous
        # redirect into a 204, which auth_request reads as "allowed".
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Content-Length "";
        # auth_request knows only 2xx, 401 and 403; the app denies with 404, or 302 to the login.
        proxy_intercept_errors on;
        error_page 302 404 = @gate_refused;
    }

    location @gate_refused {
        return 403;
    }

    # The app's deny, a plain empty 404. `return 404 ""` would send nginx's own error page, so this
    # sends an empty 200 that `error_page 403 =404` turns into the 404.
    location @denied {
        default_type "text/html; charset=utf-8";
        return 200 "";
    }

    # X-Accel-Redirect target: unreachable from outside, entered only when the app has run the
    # viewer through can_view. nginx serves the bytes and answers Range itself.
    # NO Cache-Control header and NO expires here — the app's `Cache-Control: private` must pass
    # through untouched (ADR 0017); either would replace it and make archive media cacheable by any
    # shared proxy. The redirect drops the app's CSP and nosniff, so this location adds both: an
    # uploaded SVG or HTML file runs no script.
    location /_media/ {
        internal;
        alias /canonical/;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
