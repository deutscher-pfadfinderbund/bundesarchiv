# Hooks run through `uv run` so they use the project env (no duplicate dep envs,
# no rev pinning to drift). Install once with: pre-commit install
# Two stages: commit = fast (uv-lock, ruff, pyrefly ~1s); push = the full gate
# via `mise run gate`, which starts the dev Postgres itself.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.19
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # Fail-fast type check (~0.2s) before the slow gate below. Second opinion only —
      # mypy stays canonical; noise policy lives at [tool.pyrefly] in pyproject.toml.
      - id: pyrefly
        name: pyrefly
        # Explicit paths: bare `pyrefly check` resolves zero files in .claude/worktrees/.
        entry: uv run pyrefly check src tests scripts
        language: system
        pass_filenames: false
      - id: biome
        name: biome check
        # Lint + format check, scope in biome.jsonc; mise exec because mise.toml pins the version.
        entry: mise exec -- biome check --error-on-warnings
        language: system
        pass_filenames: false
        files: ^(biome\.jsonc|\.claude/settings\.json|src/bundesarchiv/app/web/static/.*)$
      - id: gate
        name: gate
        entry: mise run gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
