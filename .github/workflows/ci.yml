# Two jobs, split by what they cost.
#
# `fast` runs on every event and takes its checks from mise.toml's `check` task
# — the same command a developer runs before every commit — plus mypy, which is
# deliberately push-time-only locally and so stays its own step here.
#
# `db` runs the Postgres-backed tests and does NOT go through mise: the mise pg
# tasks drive Apple's `container` CLI, which the runners do not have — they have
# docker. It builds the repo's own image (docker/postgres/Dockerfile, Postgres
# with the German Hunspell dictionary baked in; a `services:` block cannot build
# a local Dockerfile). The pytest marker expressions are the shared source of
# truth, so this job and mise's `test:db` select the same tests. The job is
# skipped when no DB-relevant path changed, and always runs on a push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.changes.outputs.db }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect DB-relevant changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            db:
              - 'src/**'
              - 'tests/index/**'
              - 'tests/app/**'
              - 'docker/postgres/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install mise
        uses: jdx/mise-action@v4

      # uv installs the pinned Python (.python-version: 3.14) itself.
      - name: Install dependencies
        run: uv sync

      - name: Fast checks (ruff, format, pyrefly, no-Postgres tests)
        run: mise run check

      - name: mypy
        run: uv run mypy

  db:
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'push' || needs.fast.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build and start Postgres (German Hunspell dict)
        run: |
          docker build -t bundesarchiv-postgres docker/postgres/
          docker run -d --name pg -p 5434:5432 \
            -e POSTGRES_DB=bundesarchiv \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            bundesarchiv-postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres -d bundesarchiv; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          docker logs pg >&2
          exit 1

      - name: pytest (Postgres-backed)
        run: uv run pytest -m "requires_pg and not e2e and not gallery"
