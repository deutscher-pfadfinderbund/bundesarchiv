# Two jobs, split by what they cost: `fast` runs the checks a developer runs
# before every commit; `db` runs the Postgres-backed tests against the Postgres
# image the VPS runs, so CI tests the same bytes production runs.
name: CI

on:
  push:
    branches: [main]
    paths: &relevant
      - '**'
      - '!.github/dependabot.yml'
      - '!**.md'
      - '!docs/**'
      - '!.impeccable/**'
      - '!.git-blame-ignore-revs'
      - '!.pre-commit-config.yaml'
      - '!.worktreeinclude'
      - 'docs/design/design-system.md'
      - 'design-system/**'
  pull_request:
    paths: *relevant

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  fast:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.changes.outputs.db }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect DB-relevant changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            db:
              - 'src/**'
              - 'tests/index/**'
              - 'tests/app/**'
              - 'docker/postgres/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

      - name: Install uv
        # setup-uv keeps no floating major tags past v7 — pin the full version (dependabot bumps it).
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install mise
        uses: jdx/mise-action@v5

      # uv installs the Python that requires-python names itself.
      - name: Install dependencies
        run: uv sync --locked

      - name: Fast checks (static checks, no-Postgres tests)
        run: mise run check

  db:
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'push' || needs.fast.outputs.db == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv keeps no floating major tags past v7 — pin the full version (dependabot bumps it).
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retries because a docker/postgres change triggers postgres-image.yml in
      # parallel: the new :latest may still be publishing when this job starts.
      - name: Pull Postgres image
        run: |
          for i in $(seq 1 30); do
            if docker pull ghcr.io/deutscher-pfadfinderbund/bundesarchiv-postgres:latest; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not pull the Postgres image" >&2
          exit 1

      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5434:5432 \
            -e POSTGRES_DB=bundesarchiv \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            ghcr.io/deutscher-pfadfinderbund/bundesarchiv-postgres:latest

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres -d bundesarchiv; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          docker logs pg >&2
          exit 1

      - name: pytest (Postgres-backed)
        run: uv run pytest -m "requires_pg and not e2e and not gallery"
