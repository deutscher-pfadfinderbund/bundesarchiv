# Two jobs, split by what they cost.
#
# `fast` runs on every event: lint, format, both type checkers and the
# Postgres-free bulk of the suite. `db` runs the Postgres-backed tests — it
# builds the repo's own image (docker/postgres/Dockerfile, Postgres with the
# German Hunspell dictionary baked in; a `services:` block cannot build a local
# Dockerfile). That job is skipped when no DB-relevant path changed, and always
# runs on a push to main.
#
# CI does not call the mise tasks: the Postgres tasks drive Apple's `container`
# CLI, which the runners do not have — they have docker. The pytest marker
# expressions are the shared source of truth between the two, so the split here
# and the split in mise.toml select the same tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.changes.outputs.db }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect DB-relevant changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            db:
              - 'src/**'
              - 'tests/index/**'
              - 'tests/app/**'
              - 'docker/postgres/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # uv installs the pinned Python (.python-version: 3.14) itself.
      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check .

      - name: pyrefly
        run: uv run pyrefly check

      - name: mypy
        run: uv run mypy

      - name: pytest (no Postgres)
        run: uv run pytest -m "not requires_pg"

  db:
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'push' || needs.fast.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build and start Postgres (German Hunspell dict)
        run: |
          docker build -t bundesarchiv-postgres docker/postgres/
          docker run -d --name pg -p 5434:5432 \
            -e POSTGRES_DB=bundesarchiv \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            bundesarchiv-postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres -d bundesarchiv; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          docker logs pg >&2
          exit 1

      - name: pytest (Postgres-backed)
        run: uv run pytest -m "requires_pg and not e2e and not gallery"
