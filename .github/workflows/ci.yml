# One job: the checks a developer runs before every commit, then the Postgres-backed tests
# against the Postgres image the VPS runs, so CI tests the same bytes production runs.
name: CI

on:
  push:
    branches: [main]
    paths: &relevant
      - '**'
      - '!.github/dependabot.yml'
      - '!**.md'
      - '!docs/**'
      - '!.impeccable/**'
      - '!.git-blame-ignore-revs'
      - '!.pre-commit-config.yaml'
      - '!.worktreeinclude'
      - 'docs/design/design-system.md'
      - 'design-system/**'
  pull_request:
    paths: *relevant

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Detect DB-relevant changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            db:
              - 'src/**'
              - 'tests/index/**'
              - 'tests/app/**'
              - 'docker/postgres/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

      # Pulls in the background while the checks run. Trust auth: mise exports a DSN without a password.
      - name: Start Postgres
        if: &db github.event_name == 'push' || steps.changes.outputs.db == 'true'
        run: |
          docker run -d --pull=always --name pg -p 5434:5432 \
            -e POSTGRES_DB=bundesarchiv -e POSTGRES_HOST_AUTH_METHOD=trust \
            ghcr.io/deutscher-pfadfinderbund/bundesarchiv-postgres:latest \
            >"$RUNNER_TEMP/postgres.log" 2>&1 &

      - name: Install uv
        # setup-uv keeps no floating major tags past v7 — pin the full version (dependabot bumps it).
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false # a cold sync is faster than saving and restoring the cache

      - name: Install mise
        uses: jdx/mise-action@v5

      # uv installs the Python that requires-python names itself.
      - name: Install dependencies
        run: uv sync --locked

      - name: Fast checks (static checks, no-Postgres tests)
        run: mise run check

      - name: Wait for Postgres
        if: *db
        run: |
          timeout 120 sh -c 'until docker exec pg pg_isready -q -U postgres -d bundesarchiv 2>/dev/null; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres.log"; docker logs pg; exit 1; }

      # --skip-deps: the container above, not mise's own Postgres daemon.
      - name: Postgres-backed tests
        if: *db
        run: mise run --skip-deps test:db
